<header class="px-4 py-5 w-full md:px-24 lg:px-8 bg-gray-200">
  <div class="relative w-full flex items-center justify-between">
    <a
      href="/"
      aria-label="Company"
      title="Company"
      class="inline-flex items-center"
    >
      <svg
        class="w-8 text-deep-purple-accent-400"
        viewBox="0 0 24 24"
        stroke-linejoin="round"
        stroke-width="2"
        stroke-linecap="round"
        stroke-miterlimit="10"
        stroke="currentColor"
        fill="none"
      >
        <rect x="3" y="1" width="7" height="12"></rect>
        <rect x="3" y="17" width="7" height="6"></rect>
        <rect x="14" y="1" width="7" height="6"></rect>
        <rect x="14" y="11" width="7" height="12"></rect>
      </svg>
      <span
        class="text-lg lg:text-xl font-bold tracking-wide text-gray-800 uppercase pl-2"
        >AngularStandAlone</span
      >
    </a>
    <ul class="flex items-center hidden space-x-8 lg:flex">
      <li>
        <a
          href="/customers"
          aria-label="Our customer"
          title="Our customer"
          class="font-medium tracking-wide text-gray-800 transition-colors duration-200 hover:text-deep-purple-accent-400"
          >Customers</a
        >
      </li>
      <li>
        <a
          href="/about-us"
          aria-label="About us"
          title="About us"
          class="font-medium tracking-wide text-gray-800 transition-colors duration-200 hover:text-deep-purple-accent-400"
          >About us</a
        >
      </li>
      <li>
        <a
          href="/auth/signin"
          class="inline-flex items-center justify-center h-12 px-6 font-medium tracking-wide text-gray-800 transition duration-200 rounded shadow-md bg-white focus:shadow-outline focus:outline-none"
          aria-label="Sign in"
          title="Sign in"
        >
          Sign in
        </a>
      </li>
    </ul>
    <!-- Mobile menu -->
    <div class="lg:hidden">
      <button
        aria-label="Open Menu"
        title="Open Menu"
        class="p-2 transition duration-200 rounded focus:outline-none focus:shadow-outline hover:bg-deep-purple-50 focus:bg-deep-purple-50"
      >
        <svg class="w-5 text-gray-800" viewBox="0 0 24 24">
          <path
            fill="currentColor"
            d="M23,13H1c-0.6,0-1-0.4-1-1s0.4-1,1-1h22c0.6,0,1,0.4,1,1S23.6,13,23,13z"
          ></path>
          <path
            fill="currentColor"
            d="M23,6H1C0.4,6,0,5.6,0,5s0.4-1,1-1h22c0.6,0,1,0.4,1,1S23.6,6,23,6z"
          ></path>
          <path
            fill="currentColor"
            d="M23,20H1c-0.6,0-1-0.4-1-1s0.4-1,1-1h22c0.6,0,1,0.4,1,1S23.6,20,23,20z"
          ></path>
        </svg>
      </button>
    </div>
  </div>
</header>
