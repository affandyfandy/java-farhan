<div
  *ngIf="isOpenModal"
  [@enterAnimation]
  class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50"
>
  <div class="bg-white rounded-lg shadow-lg w-full max-w-md mx-auto p-6">
    <form [formGroup]="productForm" (ngSubmit)="updateProduct()">
      <div class="modal-header flex justify-between items-center mb-4">
        <h5 class="text-xl font-semibold">
          {{ isEditing ? "Edit Product" : "View Product" }}
        </h5>
        <button
          type="button"
          class="text-gray-500 hover:text-gray-700"
          (click)="close()"
        >
          &times;
        </button>
      </div>
      <div class="modal-body space-y-4">
        <div class="form-group">
          <label for="name" class="block text-sm font-medium text-gray-700"
            >Product Name</label
          >
          <input
            id="name"
            type="text"
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50"
            formControlName="name"
            [readonly]="!isEditing"
          />
          <div
            *ngIf="
              productForm.get('name')?.invalid &&
              productForm.get('name')?.touched
            "
          >
            <small class="text-red-500">Name is required</small>
          </div>
        </div>

        <div class="form-group">
          <label for="price" class="block text-sm font-medium text-gray-700"
            >Price</label
          >
          <input
            id="price"
            type="number"
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50"
            formControlName="price"
            [readonly]="!isEditing"
          />
          <div
            *ngIf="
              productForm.get('price')?.invalid &&
              productForm.get('price')?.touched
            "
          >
            <small class="text-red-500">Price must be a positive number</small>
          </div>
        </div>

        <div class="form-group">
          <label class="inline-flex items-center cursor-pointer">
            <input
              type="checkbox"
              class="sr-only peer"
              [checked]="product.status === Status.Active"
              (change)="onStatusToggle($event)"
              [disabled]="!isEditing"
            />
            <div
              class="relative w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600"
            ></div>
            <span
              class="ms-3 text-sm font-medium text-gray-900 dark:text-gray-300"
            >
              {{ product.status === Status.Active ? "Active" : "Inactive" }}
            </span>
          </label>
        </div>

        <div class="form-group">
          <label for="quantity" class="block text-sm font-medium text-gray-700"
            >Quantity</label
          >
          <input
            id="quantity"
            type="number"
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50"
            formControlName="quantity"
            [readonly]="!isEditing"
          />
          <div
            *ngIf="
              productForm.get('quantity')?.invalid &&
              productForm.get('quantity')?.touched
            "
          >
            <small class="text-red-500"
              >Quantity must be a positive number</small
            >
          </div>
        </div>
      </div>
      <div class="modal-footer mt-4 flex justify-end space-x-2">
        <button
          type="button"
          class="bg-gray-500 hover:bg-gray-600 text-white font-semibold py-2 px-4 rounded"
          (click)="close()"
        >
          Close
        </button>
        <button
          type="button"
          class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded"
          *ngIf="!isEditing"
          (click)="startEditing()"
        >
          Edit
        </button>
        <button
          type="submit"
          class="bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-4 rounded"
          *ngIf="isEditing"
        >
          Save
        </button>
      </div>
    </form>
  </div>
</div>
