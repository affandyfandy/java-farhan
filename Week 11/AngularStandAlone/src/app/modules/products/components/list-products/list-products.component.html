<section class="container">
  <div class="flex flex-col">
    <div class="-my-2 overflow-x-auto">
      <div class="inline-block w-full py-2 align-middle md:px-4">
        <div class="w-full flex justify-between items-center">
          <div class="w-1/3 py-4">
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                <svg
                  class="w-5 h-5 text-gray-400"
                  viewBox="0 0 24 24"
                  fill="none"
                >
                  <path
                    d="M21 21L15 15M17 10C17 13.866 13.866 17 10 17C6.13401 17 3 13.866 3 10C3 6.13401 6.13401 3 10 3C13.866 3 17 6.13401 17 10Z"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  ></path>
                </svg>
              </span>
              <input
                type="text"
                class="w-full py-2 pl-10 pr-4 text-gray-700 bg-white border rounded-md dark:border-gray-600 focus:border-blue-400 dark:focus:border-blue-300 focus:outline-none focus:ring focus:ring-blue-300 focus:ring-opacity-40"
                placeholder="Search by product name"
                [(ngModel)]="productName"
                (input)="onSearch()"
              />
            </div>
          </div>
          <div>
            <p>You're searching {{ productName }}</p>
          </div>
        </div>

        <!-- <label class="inline-flex items-center cursor-pointer">
          <input type="checkbox" value="" class="sr-only peer" />
          <div
            class="relative w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600"
          ></div>
          <span
            class="ms-3 text-sm font-medium text-gray-900 dark:text-gray-300"
            >Toggle me</span
          >
        </label> -->

        <div class="overflow-hidden md:rounded-lg">
          <ag-grid-angular
            class="ag-theme-quartz"
            style="height: 350px; width: 100%"
            [rowData]="rowData"
            [columnDefs]="colDefs"
          ></ag-grid-angular>
        </div>
      </div>
    </div>
  </div>
  <app-modal-product
    [isOpenModal]="isOpenModal"
    [product]="currentProduct"
    (closeModal)="onCloseModal()"
    (productUpdated)="onProductUpdated()"
  ></app-modal-product>
</section>
