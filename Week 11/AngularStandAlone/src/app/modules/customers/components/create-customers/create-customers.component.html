<section class="max-w-6xl p-6 mx-auto bg-white rounded-md shadow-md">
  <h2 class="text-2xl font-semibold text-gray-800 capitalize">
    Create Customer
  </h2>

  <form (ngSubmit)="createCustomer()">
    <div class="grid grid-cols-1 gap-6 mt-4 sm:grid-cols-2">
      <div>
        <label class="text-gray-800 font-semibold" for="firstName"
          >First Name</label
        >
        <input
          id="firstName"
          name="firstName"
          type="text"
          [(ngModel)]="customer.firstName"
          class="block w-full px-4 py-2 mt-2 text-gray-700 bg-white border border-gray-200 rounded-md focus:border-blue-400 focus:ring-blue-300 focus:ring-opacity-40 focus:outline-none focus:ring"
        />
      </div>

      <div>
        <label class="text-gray-800 font-semibold" for="lastName"
          >Last Name</label
        >
        <input
          id="lastName"
          name="lastName"
          type="text"
          [(ngModel)]="customer.lastName"
          class="block w-full px-4 py-2 mt-2 text-gray-700 bg-white border border-gray-200 rounded-md focus:border-blue-400 focus:ring-blue-300 focus:ring-opacity-40 focus:outline-none focus:ring"
        />
      </div>

      <div>
        <label class="text-gray-800 font-semibold" for="email"
          >Email Address</label
        >
        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="customer.email"
          class="block w-full px-4 py-2 mt-2 text-gray-700 bg-white border border-gray-200 rounded-md focus:border-blue-400 focus:ring-blue-300 focus:ring-opacity-40 focus:outline-none focus:ring"
        />
      </div>

      <div>
        <label class="text-gray-800 font-semibold" for="phone">Phone</label>
        <input
          id="phone"
          name="phone"
          type="text"
          [(ngModel)]="customer.phone"
          class="block w-full px-4 py-2 mt-2 text-gray-700 bg-white border border-gray-200 rounded-md focus:border-blue-400 focus:ring-blue-300 focus:ring-opacity-40 focus:outline-none focus:ring"
        />
      </div>
    </div>

    <div class="flex justify-end gap-4 mt-6">
      <a routerLink="/customers">
        <button
          class="inline-block rounded bg-indigo-600 px-5 py-3 text-sm font-medium text-white transition hover:bg-indigo-700 focus:outline-none focus:ring"
          type="button"
        >
          Back
        </button>
      </a>
      <button
        type="submit"
        class="px-8 py-2.5 leading-5 text-white transition-colors duration-300 transform bg-gray-700 rounded-md hover:bg-gray-600 focus:outline-none focus:bg-gray-600"
      >
        Save
      </button>
    </div>
  </form>
</section>
