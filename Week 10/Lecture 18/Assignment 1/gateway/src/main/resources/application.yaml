server:
  port: 8085  # Gateway server port

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        - id: books-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/books/**
          filters:
            - name: ApiKeyFilter
              args:
                apiKeyHeaderName: api-key
                authServiceUrl: http://localhost:8084/api/v1/auth/validate
        - id: student-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/**
          filters:
            - name: ApiKeyFilter
              args:
                apiKeyHeaderName: api-key
                authServiceUrl: http://localhost:8084/api/v1/auth/validate

management:
  endpoints:
    web:
      exposure:
        include: "*"