<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add New Employee</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.15/dist/tailwind.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-gray-100">
    <div class="container mx-auto p-4">
      <h1 class="text-2xl font-bold mb-4">Add New Employee</h1>

      <form
        th:action="@{/employees/save}"
        th:object="${employee}"
        method="POST"
      >
        <div class="mb-4">
          <label for="name" class="block text-sm font-medium text-gray-700"
            >ID</label
          >
          <input
            type="text"
            id="id"
            name="id"
            th:field="*{id}"
            class="mt-1 py-2 px-4 font-medium border border-black focus:ring-indigo-500 focus:border-indigo-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md"
          />
        </div>
        <div class="mb-4">
          <label for="name" class="block text-sm font-medium text-gray-700"
            >Name</label
          >
          <input
            type="text"
            id="name"
            name="name"
            th:field="*{name}"
            class="mt-1 py-2 px-4 font-medium border border-black focus:ring-indigo-500 focus:border-indigo-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md"
          />
        </div>
        <div class="mb-4">
          <label for="dob" class="block text-sm font-medium text-gray-700"
            >Date of Birth</label
          >
          <input
            type="date"
            id="dob"
            name="dob"
            th:field="*{dob}"
            class="mt-1 py-2 px-4 font-medium border border-black focus:ring-indigo-500 focus:border-indigo-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md"
          />
        </div>
        <div class="mb-4">
          <label for="address" class="block text-sm font-medium text-gray-700"
            >Address</label
          >
          <input
            type="text"
            id="address"
            name="address"
            th:field="*{address}"
            class="mt-1 py-2 px-4 font-medium border border-black focus:ring-indigo-500 focus:border-indigo-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md"
          />
        </div>
        <div class="mb-4">
          <label
            for="department"
            class="block text-sm font-medium text-gray-700"
            >Department</label
          >
          <input
            type="text"
            id="department"
            name="department"
            th:field="*{department}"
            class="mt-1 py-2 px-4 font-medium border border-black focus:ring-indigo-500 focus:border-indigo-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md"
          />
        </div>
        <div class="mb-4">
          <label for="salary" class="block text-sm font-medium text-gray-700"
            >Salary</label
          >
          <input
            type="text"
            id="salary"
            name="salary"
            th:field="*{salary}"
            class="mt-1 py-2 mt-1 py-2 px-4 font-medium border border-black focus:ring-indigo-500 focus:border-indigo-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md"
          />
        </div>
        <div class="w-full flex items-center gap-4">
          <button
            type="submit"
            class="w-1/4 bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded"
          >
            Save
          </button>
          <a
            th:href="@{/employees/list}"
            class="w-1/4 bg-white hover:bg-gray-300 font-medium py-2 px-4 rounded text-center"
          >
            Back to Employees List</a
          >
        </div>
      </form>
    </div>
  </body>
</html>
